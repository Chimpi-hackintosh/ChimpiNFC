name: Android • Compilar APK e publicar Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Usar Android SDK do Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Instalar SDK 35
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Executar testes e gerar APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Preparar arquivos do Release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ChimpiNFC-Android-debug.apk
          (cd dist && sha256sum ChimpiNFC-Android-debug.apk > SHA256SUMS.txt)
          test -s dist/ChimpiNFC-Android-debug.apk

      - name: Enviar artefato de compilação
        uses: actions/upload-artifact@v4
        with:
          name: ChimpiNFC-Android-debug
          path: dist/
          if-no-files-found: error

      - name: Publicar APK em pré-Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ChimpiNFC 0.1.0 • APK de teste ${{ github.run_number }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            APK de teste para Android com NFC
            - Grava textos e links em etiquetas NFC NDEF regraváveis
            - Lê NDEF e informações públicas NFC de AirTags (somente leitura)
            - AirTags originais não podem ser reprogramados
            - APK com assinatura de depuração, não é um lançamento de produção
            - Hardware NFC real ainda precisa de testes
          files: |
            dist/ChimpiNFC-Android-debug.apk
            dist/SHA256SUMS.txt
